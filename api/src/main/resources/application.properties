spring.application.name=portal-api
server.port=${PORT:8081}

# ── database ───────────────────────────────────────────────────────────
# Railway supplies DATABASE_URL (postgres://user:pass@host/db); the platform
# turns it into these three. Locally, set them or use the defaults below.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/moaumpp}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# The migrations are psql scripts run by db/migrate.sh BEFORE this service
# starts (railway.json preDeployCommand). This service never migrates.

# ── authentication ─────────────────────────────────────────────────────
# Production: Keycloak, by issuer. Development and CI: a shared HMAC secret,
# so tokens can be minted without an identity provider. One of the two.
moaum.auth.issuer-uri=${MOAUM_AUTH_ISSUER_URI:}
moaum.auth.hmac-secret=${MOAUM_AUTH_HMAC_SECRET:}

# The outbox (V025): a provider is whatever answers an HTTP POST of {to, subject, body} with a bearer.
# While neither URL is set, notices stay QUEUED and the platform dashboard says so.
moaum.notices.email-url=${MOAUM_NOTICES_EMAIL_URL:}
moaum.notices.sms-url=${MOAUM_NOTICES_SMS_URL:}
moaum.notices.token=${MOAUM_NOTICES_TOKEN:}
# how the provider wants the POST: generic {to,subject,body}; termii (SMS, needs the sender id); resend (email, needs the from address)
moaum.notices.sms-format=${MOAUM_NOTICES_SMS_FORMAT:generic}
moaum.notices.sms-from=${MOAUM_NOTICES_SMS_FROM:MOAUM}
moaum.notices.email-format=${MOAUM_NOTICES_EMAIL_FORMAT:generic}
moaum.notices.email-from=${MOAUM_NOTICES_EMAIL_FROM:MOAUM Portal <portal@moaum.edu.ng>}
# where the portal lives, for the links in notices
moaum.portal-url=${MOAUM_PORTAL_URL:https://moaum-portal-production.up.railway.app}

# Single sign-on for staff through the University's OpenID Connect provider (Keycloak).
# Off until the three below are set; MFA is required of every SSO sign-in unless switched off.
moaum.sso.issuer=${MOAUM_SSO_ISSUER:}
moaum.sso.client-id=${MOAUM_SSO_CLIENT_ID:}
moaum.sso.client-secret=${MOAUM_SSO_CLIENT_SECRET:}
moaum.sso.require-mfa=${MOAUM_SSO_REQUIRE_MFA:true}
moaum.sso.mfa-acr=${MOAUM_SSO_MFA_ACR:mfa,otp,2fa,gold,silver}
moaum.sso.staff-claim=${MOAUM_SSO_STAFF_CLAIM:staff_number}
moaum.sso.label=${MOAUM_SSO_LABEL:Sign in with the University's single sign-on}

# The payment gateways: each is on when its secret is set, and the applicant's button says so when none is.
# Paystack signs its webhook with the secret key; Flutterwave sends the hash set on its dashboard as verif-hash.
moaum.payments.paystack-secret=${MOAUM_PAYSTACK_SECRET:}
moaum.payments.flutterwave-secret=${MOAUM_FLUTTERWAVE_SECRET:}
moaum.payments.flutterwave-hash=${MOAUM_FLUTTERWAVE_HASH:}

# ── observability ──────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true
