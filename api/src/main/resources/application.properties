spring.application.name=portal-api
server.port=${PORT:8081}

# ── database ───────────────────────────────────────────────────────────
# Railway supplies DATABASE_URL (postgres://user:pass@host/db); the platform
# turns it into these three. Locally, set them or use the defaults below.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/moaumpp}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# The migrations are psql scripts run by db/migrate.sh BEFORE this service
# starts (railway.json preDeployCommand). This service never migrates.

# ── authentication ─────────────────────────────────────────────────────
# Production: Keycloak, by issuer. Development and CI: a shared HMAC secret,
# so tokens can be minted without an identity provider. One of the two.
moaum.auth.issuer-uri=${MOAUM_AUTH_ISSUER_URI:}
moaum.auth.hmac-secret=${MOAUM_AUTH_HMAC_SECRET:}

# The outbox (V025): a provider is whatever answers an HTTP POST of {to, subject, body} with a bearer.
# While neither URL is set, notices stay QUEUED and the platform dashboard says so.
moaum.notices.email-url=${MOAUM_NOTICES_EMAIL_URL:}
moaum.notices.sms-url=${MOAUM_NOTICES_SMS_URL:}
moaum.notices.token=${MOAUM_NOTICES_TOKEN:}
# how the provider wants the POST: generic {to,subject,body}; termii (SMS, needs the sender id); resend (email, needs the from address)
moaum.notices.sms-format=${MOAUM_NOTICES_SMS_FORMAT:generic}
moaum.notices.sms-from=${MOAUM_NOTICES_SMS_FROM:MOAUM}
moaum.notices.email-format=${MOAUM_NOTICES_EMAIL_FORMAT:generic}
moaum.notices.email-from=${MOAUM_NOTICES_EMAIL_FROM:MOAUM Portal <portal@moaum.edu.ng>}
# where the portal lives, for the links in notices
moaum.portal-url=${MOAUM_PORTAL_URL:https://moaum-portal-production.up.railway.app}

# Single sign-on for staff through the University's OpenID Connect provider (Keycloak).
# Off until the three below are set; MFA is required of every SSO sign-in unless switched off.
moaum.sso.issuer=${MOAUM_SSO_ISSUER:}
moaum.sso.client-id=${MOAUM_SSO_CLIENT_ID:}
moaum.sso.client-secret=${MOAUM_SSO_CLIENT_SECRET:}
moaum.sso.require-mfa=${MOAUM_SSO_REQUIRE_MFA:true}
moaum.sso.mfa-acr=${MOAUM_SSO_MFA_ACR:mfa,otp,2fa,gold,silver}
moaum.sso.staff-claim=${MOAUM_SSO_STAFF_CLAIM:staff_number}
moaum.sso.label=${MOAUM_SSO_LABEL:Sign in with the University's single sign-on}

# The payment gateways: each is on when its secret is set, and the applicant's button says so when none is.
# Paystack signs its webhook with the secret key; Flutterwave sends the hash set on its dashboard as verif-hash.
moaum.payments.paystack-secret=${MOAUM_PAYSTACK_SECRET:}
moaum.payments.flutterwave-secret=${MOAUM_FLUTTERWAVE_SECRET:}
moaum.payments.flutterwave-hash=${MOAUM_FLUTTERWAVE_HASH:}
# Quickteller on Interswitch WebPAY: the MAC keys are secrets — set them here as service
# variables or, preferably, on Finance → Gateways where they are stored encrypted. The
# product and pay-item ids are not secret and default to the University's.
moaum.payments.quickteller.product-id=${MOAUM_QUICKTELLER_PRODUCT_ID:6498}
moaum.payments.quickteller.pay-item-id=${MOAUM_QUICKTELLER_PAY_ITEM_ID:101}
moaum.payments.quickteller.mac-key=${MOAUM_QUICKTELLER_MAC_KEY:}
moaum.payments.quickteller.chs-product-id=${MOAUM_QUICKTELLER_CHS_PRODUCT_ID:6207}
moaum.payments.quickteller.chs-pay-item-id=${MOAUM_QUICKTELLER_CHS_PAY_ITEM_ID:101}
moaum.payments.quickteller.chs-mac-key=${MOAUM_QUICKTELLER_CHS_MAC_KEY:}
moaum.payments.quickteller.sandbox=${MOAUM_QUICKTELLER_SANDBOX:false}
# Pay on Quickteller (V299): the service username and password Interswitch sends with each payment
# notification. Set them here as service variables or, preferably, on Finance → Gateways where they
# are stored encrypted; without them no notification is believed.
moaum.payments.paydirect.username=${MOAUM_PAYDIRECT_USERNAME:}
moaum.payments.paydirect.password=${MOAUM_PAYDIRECT_PASSWORD:}

# ── files (V310) ───────────────────────────────────────────────────────
# DB: every file's bytes stay in PostgreSQL (Railway). S3: new files go to the bucket and, with
# migrate=true, the files already in the database are moved there a few hundred at a time, each
# read back and hash-checked before its database copy is cleared. Credentials come from the runtime.
moaum.files.provider=${MOAUM_FILES_PROVIDER:DB}
moaum.files.bucket=${MOAUM_FILES_BUCKET:}
moaum.files.region=${MOAUM_FILES_REGION:${AWS_REGION:af-south-1}}
moaum.files.migrate=${MOAUM_FILES_MIGRATE:false}
moaum.files.migrate-batch=${MOAUM_FILES_MIGRATE_BATCH:200}

# ── scheduled jobs ─────────────────────────────────────────────────────
# Spring schedules on ONE thread unless told otherwise. The notice dispatcher sends up to fifty
# emails/SMS a minute synchronously, and on production that single thread held the audit
# sealer (every 15 s by design) to once every few minutes. Four threads: the sealer, the
# dispatcher, and the daily clocks never queue behind each other.
spring.task.scheduling.pool.size=4

# ── observability ──────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true
